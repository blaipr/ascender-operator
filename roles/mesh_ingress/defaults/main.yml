---
deployment_type: awx

# The deployment this Mesh Ingress attaches to. It is a different kind at a
# different version from the Mesh Ingress CR itself, so it cannot read the
# `kind` and `api_version` the other roles use for their own resource.
deployment_kind: 'AWX'
deployment_api_version: '{{ deployment_type }}.ansible.com/v1beta1'

ingress_type: none
ingress_api_version: 'networking.k8s.io/v1'
ingress_annotations: ''
ingress_class_name: ''
ingress_controller: ''
route_annotations: ''

set_self_owneref: true

_control_plane_ee_image: "ghcr.io/ctrliq/ascender-ee:{{ lookup('env', 'DEFAULT_AWX_VERSION') or 'latest' }}"
_image_pull_policy: Always
image_pull_secrets: []

# Render the Mesh Ingress pod to satisfy Pod Security Admission "restricted". Opt-in.
restricted_security_context: false

finalizer_run: false

node_selector: ''
topology_spread_constraints: ''
tolerations: ''
affinity: {}

# Number of old ReplicaSets to retain for rollback.
revision_history_limit: 2
