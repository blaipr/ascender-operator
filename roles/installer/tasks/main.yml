---
- name: Look for a deployment of the same name under the other API group
  k8s_info:
    api_version: "{{ conflicting_api_version }}"
    kind: "{{ conflicting_kind }}"
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: conflicting_deployment
  # The other group's CRD need not be installed, and that is not an error here.
  ignore_errors: true

- name: Refuse to reconcile objects another deployment already manages
  fail:
    # yamllint disable-line rule:line-length
    msg: "{{ conflicting_kind }}/{{ ansible_operator_meta.name }} already exists in namespace {{ ansible_operator_meta.namespace }}. Both kinds name and label every object they manage from deployment_type, which is {{ deployment_type }} on either side, so the two would reconcile the same Deployment, Service, StatefulSet and ConfigMap against different specs. Rename one of them, or remove the one that is no longer wanted."
  when:
    - conflicting_deployment is not failed
    - (conflicting_deployment.resources | default([]) | length) > 0

- name: Check for presence of old awx Deployment
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: awx_deployment

- name: Check for presence of awx-task Deployment
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-task"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: awx_task_deployment

- name: Check for presence of awx-web Deployment
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ansible_operator_meta.name }}-web"
    namespace: "{{ ansible_operator_meta.namespace }}"
  register: awx_web_deployment

- name: Start installation if auto_upgrade is true
  include_tasks: install.yml
  when:
    - auto_upgrade | bool

- name: Start installation if auto_upgrade is false and deployment is missing
  include_tasks: install.yml
  when:
    - not (auto_upgrade | bool)
    - not (awx_deployment['resources'] | length > 0)
    - not (awx_web_deployment['resources'] | length > 0 and awx_task_deployment['resources'] | length > 0)
