---
# Use the 'create api' subcommand to add watches to this file.
- version: v1beta1
  group: awx.ansible.com
  kind: AWX
  playbook: playbooks/awx.yml
  snakeCaseParameters: False

- version: v1beta1
  group: awx.ansible.com
  kind: AWXBackup
  role: backup
  snakeCaseParameters: False
  finalizer:
    name: awx.ansible.com/finalizer
    role: backup
    vars:
      finalizer_run: true

- version: v1beta1
  group: awx.ansible.com
  kind: AWXRestore
  role: restore
  snakeCaseParameters: False

- version: v1alpha1
  group: awx.ansible.com
  kind: AWXMeshIngress
  role: mesh_ingress
  snakeCaseParameters: False
  finalizer:
    name: awx.ansible.com/awx-mesh-ingress-finalizer
    role: mesh_ingress
    vars:
      finalizer_run: true

# The same four resources under the Ascender group, reconciled by the same
# playbook and roles, with deployment_type following the kind. That is the
# variable the naming hangs off: the database and its user, the label every
# managed object carries, and the configmap names. A deployment created as an
# Ascender is therefore Ascender all the way down, with no awx left in it.
#
# It is also why an existing deployment cannot simply be relabelled in place.
# deployment_type appears in spec.selector.matchLabels, which Kubernetes will
# not let anyone change, so moving one across means recreating its workloads
# and renaming its database. hack/migrate-awx-to-ascender.sh does exactly that.
- version: v1beta1
  group: ascender.ansible.com
  kind: Ascender
  playbook: playbooks/awx.yml
  snakeCaseParameters: False
  vars:
    api_group: ascender.ansible.com
    deployment_type: ascender
    kind: Ascender
    restore_kind: AscenderRestore
    # Without this the guard in the installer would find this very object and
    # refuse to reconcile it.
    conflicting_kind: AWX
    conflicting_api_version: awx.ansible.com/v1beta1

- version: v1beta1
  group: ascender.ansible.com
  kind: AscenderBackup
  role: backup
  snakeCaseParameters: False
  vars:
    api_group: ascender.ansible.com
    deployment_type: ascender
    kind: AscenderBackup
    deployment_kind: Ascender
  finalizer:
    name: ascender.ansible.com/finalizer
    role: backup
    vars:
      finalizer_run: true
      api_group: ascender.ansible.com
      deployment_type: ascender
      kind: AscenderBackup
      deployment_kind: Ascender

- version: v1beta1
  group: ascender.ansible.com
  kind: AscenderRestore
  role: restore
  snakeCaseParameters: False
  vars:
    api_group: ascender.ansible.com
    deployment_type: ascender
    kind: AscenderRestore
    deployment_kind: Ascender
    backup_kind: AscenderBackup

- version: v1alpha1
  group: ascender.ansible.com
  kind: AscenderMeshIngress
  role: mesh_ingress
  snakeCaseParameters: False
  vars:
    api_group: ascender.ansible.com
    deployment_type: ascender
    deployment_kind: Ascender
  finalizer:
    name: ascender.ansible.com/ascender-mesh-ingress-finalizer
    role: mesh_ingress
    vars:
      finalizer_run: true
      api_group: ascender.ansible.com
      deployment_type: ascender
      deployment_kind: Ascender

# +kubebuilder:scaffold:watch
